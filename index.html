<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b1b4a">
<title>Fairy Garden Math</title>
<style>
:root{
  --sky1:#2b1b4a; --sky2:#3d2a6b; --sky3:#1f5a66;
  --cream:#fff6e5; --ink:#3a2a55; --soft:#8b7aa8;
  --pink:#ff7fb0; --gold:#ffb938; --mint:#58c98f; --lilac:#b79cff;
  --cell:clamp(28px,5.6vw,52px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:ui-rounded,"SF Pro Rounded","Nunito","Baloo 2","Varela Round","Trebuchet MS",system-ui,sans-serif;
  color:var(--ink);
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 45%,var(--sky3) 100%) fixed;
  overflow-x:hidden; user-select:none; -webkit-user-select:none; touch-action:manipulation;
}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--lilac);outline-offset:3px}

/* drifting fireflies in the sky */
.fly{position:fixed;width:6px;height:6px;border-radius:50%;background:#fff3a8;
  box-shadow:0 0 10px 3px rgba(255,240,150,.7);pointer-events:none;opacity:.2;
  animation:drift 9s ease-in-out infinite alternate, glow 3s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(40px,-50px)}}
@keyframes glow{to{opacity:.9}}

.screen{display:none;min-height:100%;flex-direction:column;align-items:center;position:relative;z-index:1;
  padding:max(14px,env(safe-area-inset-top)) 14px max(18px,env(safe-area-inset-bottom))}
.screen.on{display:flex}

/* ---------- garden ---------- */
.gtop{width:100%;max-width:820px;display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{margin:0;font-size:clamp(26px,5vw,44px);color:#fff3d6;letter-spacing:.5px;
  text-shadow:0 2px 0 rgba(0,0,0,.25),0 0 22px rgba(255,220,150,.45)}
.pill{background:rgba(255,255,255,.14);color:#fff3d6;border-radius:999px;padding:6px 14px 6px 6px;
  display:flex;align-items:center;gap:6px;font-size:clamp(18px,3vw,26px);font-weight:700}
.pill svg{width:38px;height:38px}
.round{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.14);color:#fff3d6;
  font-size:26px;display:grid;place-items:center;flex:none}
.round:active{transform:scale(.94)}
.sub{color:#d9cdf3;font-size:clamp(15px,2.4vw,20px);margin:6px 0 10px;text-align:center;min-height:1.4em}
.plots{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2vw,18px);
  width:min(94vw,74vh,760px);margin-top:4px}
.plot{position:relative;aspect-ratio:1/1.08;border-radius:28px;padding:0;
  background:radial-gradient(34% 13% at 50% 91%,#7a4d33 0 98%,transparent 100%),
             radial-gradient(75% 26% at 50% 100%,#3f9a5e 0 98%,transparent 100%),
             rgba(255,255,255,.07);overflow:hidden;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.1)}
.plot:active{transform:scale(.97)}
.plot .plant{position:absolute;inset:2% 8% 4%;width:84%;height:94%}
.plot .plus{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:38%;aspect-ratio:1;
  border-radius:50%;border:3px dashed rgba(255,243,214,.7);color:#fff3d6;display:grid;place-items:center;
  font-size:clamp(26px,6vw,48px);font-weight:700;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.1);opacity:.75}}
.plot .fairy{position:absolute;right:2%;top:0;width:38%;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-9px) rotate(4deg)}}
.pips{position:absolute;left:0;right:0;bottom:3%;display:flex;justify-content:center;gap:5px}
.pip{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.3)}
.pip.on{background:#ffe08a;box-shadow:0 0 8px #ffe08a}
.banner{margin-top:14px;background:var(--cream);border-radius:22px;padding:14px 18px;text-align:center;
  font-size:clamp(17px,2.8vw,22px);font-weight:700}

.big{background:linear-gradient(180deg,#6fdca4,#3fae7c);color:#12402b;font-weight:800;
  border-radius:999px;padding:14px 26px;font-size:clamp(19px,3vw,26px);box-shadow:0 5px 0 #2c8a5f}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 #2c8a5f}
.big.alt{background:linear-gradient(180deg,#e2d6ff,#b79cff);color:#35205f;box-shadow:0 5px 0 #8b6fe0}
.big.alt:active{box-shadow:0 2px 0 #8b6fe0}

/* ---------- play ---------- */
.ptop{width:100%;max-width:900px;display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ptop .mini{width:60px;height:66px;flex:none}
.ptop .who{flex:1;color:#fff3d6;font-weight:800;font-size:clamp(17px,3vw,24px)}
.ptop .pips{position:static;justify-content:flex-start;margin-top:6px}
.ptop .pip{width:14px;height:14px}
.card{width:100%;max-width:900px;background:var(--cream);border-radius:30px;
  padding:clamp(12px,2.4vw,22px);box-shadow:0 12px 40px rgba(0,0,0,.3);
  display:flex;flex-direction:column;align-items:center;gap:clamp(8px,1.6vw,14px)}
.clues{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:38px}
.clue{background:#efe4ff;border-radius:999px;padding:5px 14px;font-weight:800;font-size:clamp(17px,2.8vw,24px);color:#5a3fa0}
.clue::before{content:"✦ ";color:var(--gold)}
.whole{font-size:clamp(17px,2.8vw,24px);font-weight:700;color:var(--soft);min-height:1.5em}
.whole b{font-size:1.5em;color:var(--ink)}
.pic{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:clamp(8px,2vw,18px);min-height:calc(var(--cell)*2 + 24px)}
.frame{display:grid;grid-template-columns:repeat(5,var(--cell));grid-template-rows:repeat(2,var(--cell));
  border:3px solid #cdbfa5;border-radius:12px;background:#fffdf6;overflow:hidden}
.cellx{border:1.5px solid #e4d8c0;display:grid;place-items:center}
.dot{width:74%;height:74%;border-radius:50%;position:relative;animation:pop .3s ease-out both}
@keyframes pop{from{transform:scale(0)}}
.dot.A{background:radial-gradient(circle at 35% 30%,#ffd0e2,var(--pink) 60%)}
.dot.B{background:radial-gradient(circle at 35% 30%,#ffe9b0,var(--gold) 60%)}
.dot.ghost{background:none;border:3px dashed #b9a98c;animation:none}
.dot.away{opacity:.28;animation:none}
.dot.away::after{content:"";position:absolute;left:-12%;right:-12%;top:46%;height:4px;border-radius:2px;
  background:#6b5a86;transform:rotate(-40deg)}
.still .dot:not(.new){animation:none}
.cover.m span{padding-top:0;padding-bottom:34%}
.dot.new{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.cover{width:calc(var(--cell)*2.6);height:calc(var(--cell)*2.4);position:relative;flex:none}
.cover svg{width:100%;height:100%}
.cover span{position:absolute;inset:0;display:grid;place-items:center;padding-top:8%;
  font-size:calc(var(--cell)*1.05);font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
.eq{display:flex;align-items:center;gap:clamp(8px,1.8vw,18px);font-weight:900;
  font-size:clamp(40px,8.4vw,76px);line-height:1}
.eq .op{color:var(--soft)}
.eq .blank{min-width:1.35em;height:1.3em;border-radius:18px;border:4px dashed var(--lilac);
  display:grid;place-items:center;color:var(--lilac);background:#f6f0ff;padding:0 .12em}
.eq .blank.done{border-style:solid;border-color:var(--mint);background:#e2f8ec;color:#1f7a4d;animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.ask{font-size:clamp(17px,2.8vw,24px);font-weight:700;color:var(--soft);text-align:center;
  display:flex;align-items:center;gap:10px;min-height:48px}
.say{width:46px;height:46px;border-radius:50%;background:#efe4ff;font-size:22px;flex:none}
.track{display:grid;grid-template-columns:repeat(11,1fr);gap:clamp(4px,.9vw,8px);width:100%}
.num{height:clamp(44px,7.4vw,66px);border-radius:16px;background:#fff;font-weight:800;
  font-size:clamp(18px,3.4vw,30px);box-shadow:0 4px 0 #d9ccb4, inset 0 0 0 2px #eadfc9}
.num:active{transform:translateY(3px);box-shadow:0 1px 0 #d9ccb4, inset 0 0 0 2px #eadfc9}
.num.nope{opacity:.3;animation:shake .35s}
.num.yes{background:#bdf0d3;box-shadow:0 4px 0 #58c98f, inset 0 0 0 2px #58c98f}
.num:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:60px}
.hintbtn{background:#fff1c9;border-radius:999px;padding:10px 18px;font-weight:800;font-size:clamp(16px,2.6vw,21px);
  box-shadow:0 4px 0 #e6c877}
.hintbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #e6c877}
.hide{display:none!important}

/* ---------- modals ---------- */
.modal{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;
  background:rgba(25,14,48,.72);padding:16px;overflow:auto}
.modal.on{display:flex}
.sheet{background:var(--cream);border-radius:30px;padding:clamp(16px,3vw,28px);width:min(680px,100%);
  text-align:center;animation:pop .3s ease-out}
.sheet h2{margin:0 0 12px;font-size:clamp(22px,4vw,32px)}
.seeds{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.seed{background:#fff;border-radius:22px;padding:10px 8px 12px;box-shadow:0 4px 0 #d9ccb4, inset 0 0 0 2px #eadfc9}
.seed:active{transform:translateY(3px)}
.seed svg{width:clamp(80px,17vw,120px);height:clamp(90px,19vw,134px)}
.seed b{display:block;font-size:clamp(17px,2.8vw,22px)}
.seed em{display:inline-block;font-style:normal;font-weight:800;background:#efe4ff;color:#5a3fa0;border-radius:999px;
  padding:3px 12px;margin:5px 0 3px;font-size:clamp(14px,2.3vw,18px)}
.seed i{display:block;font-style:normal;font-weight:900;color:var(--ink);font-size:clamp(18px,3vw,24px);white-space:pre-wrap}
/* ---------- celebration ---------- */
.stage{position:relative;width:min(92vw,60vh,640px);aspect-ratio:1;margin:8px 0 14px}
.stage .plots{position:absolute;left:20%;top:20%;width:60%;margin:0;gap:6px}
.stage .plot{border-radius:16px;aspect-ratio:1}
.ring{position:absolute;inset:0;animation:spin 18s linear infinite;pointer-events:none}
.pf{position:absolute;left:50%;top:50%;width:15%;aspect-ratio:1;margin:-7.5% 0 0 -7.5%;
  transform:rotate(var(--a)) translateY(-285%)}
.pf>span{display:block;animation:unspin 18s linear infinite}
.pf>span>span{display:block;transform:rotate(calc(-1*var(--a)))}
.pf svg{display:block;width:100%;animation:bob 1.1s ease-in-out infinite;animation-delay:var(--d)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes unspin{to{transform:rotate(-360deg)}}
.grow{display:flex;align-items:center;justify-content:center;gap:clamp(6px,2vw,20px);flex-wrap:wrap}
.grow .newplant{width:clamp(110px,24vw,170px);height:clamp(124px,27vw,190px);animation:rise .9s cubic-bezier(.3,1.5,.5,1)}
@keyframes rise{from{transform:scale(.4) translateY(40px);opacity:0}}
.bond{width:clamp(150px,30vw,220px)}
.fam{font-weight:800;font-size:clamp(18px,3vw,26px);color:#5a3fa0;line-height:1.5}
.msg{font-size:clamp(18px,3vw,24px);font-weight:700;margin:8px 0 14px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;
  border-bottom:2px solid #eadfc9;font-weight:700;font-size:clamp(16px,2.6vw,20px);text-align:left}
.seg{display:flex;background:#eadfc9;border-radius:999px;padding:4px}
.seg button{border-radius:999px;padding:8px 16px;background:none;font-weight:800}
.seg button.on{background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.danger{background:#ffd9d9;border-radius:999px;padding:10px 18px;font-weight:800}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<!-- ================= GARDEN ================= -->
<section id="garden" class="screen on">
  <div class="gtop">
    <div class="pill" aria-label="Fairies"><span id="fairyIcon"></span><span id="fairyCount">0</span></div>
    <h1>Fairy Garden</h1>
    <button class="round" id="gear" aria-label="Grown-up settings">⚙</button>
  </div>
  <div class="sub" id="gsub"></div>
  <div class="plots" id="plots"></div>
  <div class="banner hide" id="doneBanner">
    Every plant is blooming! The fairies love it here.<br><br>
    <button class="big alt" id="again">Watch the fairies dance</button>
    <button class="big" id="newGarden">Plant a new garden</button>
  </div>
</section>

<!-- ================= CELEBRATION ================= -->
<section id="party" class="screen">
  <h1>You grew the whole garden!</h1>
  <div class="sub">All 9 fairies are dancing for you</div>
  <div class="stage"><div class="plots" id="partyPlots"></div><div class="ring" id="ring"></div></div>
  <div class="row">
    <button class="big alt" id="partyBack">Back to my garden</button>
    <button class="big" id="partyNew">Plant a new garden</button>
  </div>
</section>

<!-- ================= PLAY ================= -->
<section id="play" class="screen">
  <div class="ptop">
    <button class="round" id="home" aria-label="Back to garden">🏡</button>
    <span class="mini" id="mini"></span>
    <div class="who"><span id="pname"></span><div class="pips" id="ppips"></div></div>
  </div>
  <div class="card">
    <div class="clues" id="clues"></div>
    <div class="whole" id="whole"></div>
    <div class="pic" id="pic"></div>
    <div class="eq" id="eq"></div>
    <div class="ask"><button class="say" id="say" aria-label="Read it to me">🔊</button><span id="ask"></span></div>
    <div class="track" id="track"></div>
    <div class="row">
      <button class="hintbtn" id="hint">💡 Peek</button>
      <button class="big hide" id="next">Next ➜</button>
    </div>
  </div>
</section>

<!-- seed picker -->
<div class="modal" id="seedModal"><div class="sheet">
  <h2>Pick a seed to plant</h2>
  <div class="seeds" id="seeds"></div>
  <p><button class="big alt" id="seedCancel">Not now</button></p>
</div></div>

<!-- round finished -->
<div class="modal" id="growModal"><div class="sheet">
  <h2 id="growTitle">It grew!</h2>
  <div class="grow">
    <span id="bond"></span>
    <div class="fam" id="fam"></div>
    <span class="newplant" id="newplant"></span>
  </div>
  <div class="msg" id="growMsg"></div>
  <div class="row">
    <button class="big" id="more">Grow more 🌱</button>
    <button class="big alt" id="toGarden">Garden 🏡</button>
  </div>
</div></div>

<!-- settings -->
<div class="modal" id="setModal"><div class="sheet">
  <h2>For grown-ups</h2>
  <div class="opt"><span>Numbers go up to</span>
    <span class="seg" id="segMax"><button data-v="10">10</button><button data-v="20">20</button></span></div>
  <div class="opt"><span>Sounds</span>
    <span class="seg" id="segSnd"><button data-v="1">On</button><button data-v="0">Off</button></span></div>
  <div class="opt"><span>Start over (clears the garden)</span><button class="danger" id="reset">Reset</button></div>
  <p><button class="big" id="setClose">Done</button></p>
</div></div>

<script>
/* =====================================================================
   Fairy Garden Math — one file, no dependencies.
   Each plant practises one idea. Every round uses ONE number family
   (two parts and a whole) and asks linked questions about it, so the
   addition fact just solved becomes the clue for the subtraction fact.
   ===================================================================== */

/*__LOGIC_START__*/
const PLANTS = {
  twin:     {name:'Twin Blossom',      skill:'Doubles',         ex:'6 + 6 = ?'},
  daisy:    {name:'Ten-Petal Daisy',   skill:'Make 10',         ex:'7 + ? = 10'},
  mushroom: {name:'Peekaboo Mushroom', skill:'Find the hidden number', ex:'5 + ? = 8'},
  vine:     {name:'Family Vine',       skill:'Add, then take away',    ex:'8 + 4 = ?   12 − 8 = ?'}
};
const MAX_STAGE = 4;
function R(a,b){return a+Math.floor(Math.random()*(b-a+1));}

/* ---- step builders. "first"/"second" are the two groups of dots drawn in the ten-frames.
   kind A = pink part, kind B = gold part. state: full | ghost (empty outline) | cover (hidden) | away */
function add(x,y,kx,ky){
  return {tokens:[x,'+',y,'=',null],answer:x+y,whole:null,
    first:{n:x,kind:kx,state:'full'},second:{n:y,kind:ky,state:'full'},
    ask:'How many altogether?',say:x+' plus '+y+'. How many altogether?'};
}
function miss(x,y,w,st){
  return {tokens:[x,'+',null,'=',w],answer:y,whole:w,
    first:{n:x,kind:'A',state:'full'},second:{n:y,kind:'B',state:st},
    ask: st==='ghost' ? 'How many more to make '+w+'?' : 'How many are hiding?',
    say: st==='ghost' ? x+' and how many more make '+w+'?' : w+' altogether. You can see '+x+'. How many are hiding?'};
}
function sub(w,x,kx,y,ky){
  return {tokens:[w,'−',x,'=',null],answer:y,whole:w,
    first:{n:x,kind:kx,state:'away'},second:{n:y,kind:ky,state:'cover'},
    ask:x+' fly away. How many are left?',say:w+' altogether. '+x+' fly away. How many are left?'};
}
function splitWhole(w){ const a=R(Math.max(1,w-10),Math.min(10,w-1)); return [a,w-a]; }
function pickWhole(stage,max){ return (max===10||stage<2) ? R(4,10) : R(11,max); }

/* ---- one generator per plant: returns {a,b,w,steps[]} ---- */
const GEN = {
  twin(stage,max){            // doubles, then near-doubles
    const hi = max===10 ? 5 : 10;
    const a = stage<2 ? R(1,Math.min(5,hi)) : R(max===10?2:4,hi);
    let b=a; if(stage>=2 && Math.random()<.5 && a+a+1<=max) b=a+1;
    const w=a+b; return {a,b,w,steps:[add(a,b,'A','B'),sub(w,a,'A',b,'B')]};
  },
  daisy(stage,max){           // make ten, then bridge through ten
    if(max===10||stage<2){ const a=R(1,9),b=10-a; return {a,b,w:10,steps:[miss(a,b,10,'ghost'),sub(10,a,'A',b,'B')]}; }
    const a=R(6,9),b=R(11-a,9),w=a+b; return {a,b,w,steps:[add(a,b,'A','B'),sub(w,a,'A',b,'B')]};
  },
  mushroom(stage,max){        // missing part, then take away the other part
    const w=pickWhole(stage,max),[a,b]=splitWhole(w);
    return {a,b,w,steps:[miss(a,b,w,'cover'),sub(w,b,'B',a,'A')]};
  },
  vine(stage,max){            // whole fact family: a+b, b+a, w-a
    let a,b,w;
    if(stage>=2 && max===20 && Math.random()<.4){ a=R(11,16); b=R(2,20-a); w=a+b; }
    else { w=pickWhole(stage,max); if(w<5) w=5; [a,b]=splitWhole(w); }
    return {a,b,w,steps:[add(a,b,'A','B'),add(b,a,'B','A'),sub(w,a,'A',b,'B')]};
  }
};
/*__LOGIC_END__*/

/* ================= saved state ================= */
const KEY='fairy-garden-v1';
function fresh(){return {plots:Array(9).fill(null),fairies:0,garden:1,max:20,sound:true};}
function load(){
  try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s&&Array.isArray(s.plots)&&s.plots.length===9) return Object.assign(fresh(),s); }catch(e){}
  return fresh();
}
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} }
let S=load();

/* ================= drawing ================= */
const $=id=>document.getElementById(id);
function leaf(x,y,rot,len,col){return `<ellipse cx="${x+len}" cy="${y}" rx="${len}" ry="${len*.45}" fill="${col}" transform="rotate(${rot} ${x} ${y})"/>`;}
function flower(cx,cy,n,pr,dist,col,ccol,cr){
  let s=''; for(let i=0;i<n;i++) s+=`<ellipse cx="${cx}" cy="${cy-dist}" rx="${pr*.55}" ry="${pr}" fill="${col}" transform="rotate(${i*360/n} ${cx} ${cy})"/>`;
  return s+`<circle cx="${cx}" cy="${cy}" r="${cr}" fill="${ccol}"/>`;
}
function mush(cx,by,s){
  return `<path d="M${cx-7*s} ${by} Q${cx-9*s} ${by-28*s} ${cx-5*s} ${by-40*s} L${cx+5*s} ${by-40*s} Q${cx+9*s} ${by-28*s} ${cx+7*s} ${by} Z" fill="#fff3dc"/>
  <path d="M${cx-30*s} ${by-38*s} Q${cx} ${by-92*s} ${cx+30*s} ${by-38*s} Q${cx} ${by-30*s} ${cx-30*s} ${by-38*s} Z" fill="#ff6b6b"/>
  <circle cx="${cx-12*s}" cy="${by-51*s}" r="${4*s}" fill="#fff"/><circle cx="${cx+7*s}" cy="${by-58*s}" r="${5*s}" fill="#fff"/><circle cx="${cx+17*s}" cy="${by-45*s}" r="${3*s}" fill="#fff"/>`;
}
function plantSVG(type,stage){
  const G1='#4fc27c',G2='#2f8f58'; let g='';
  if(stage===0){
    g=`<ellipse cx="50" cy="106" rx="8" ry="5.5" fill="#8a5a3c"/><ellipse cx="47.5" cy="104.5" rx="2.4" ry="1.3" fill="#c9966f"/>
       <path d="M50 88 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z" fill="#ffe08a"/>`;
  } else if(type==='mushroom'){
    g=mush(50,110,[0,.4,.6,.8,1][stage]);
    if(stage===4) g+=mush(80,110,.42)+mush(21,110,.3);
  } else {
    const h=[0,22,44,60,66][stage], top=110-h, L=4+stage*1.6;
    if(type==='vine'){
      const bz=t=>{const u=1-t;return [u*u*u*50+3*u*u*t*26+3*u*t*t*74+t*t*t*50, 110-h*(3*u*u*t*.3+3*u*t*t*.6+t*t*t)];};
      g+=`<path d="M50 110 C26 ${110-h*.3} 74 ${110-h*.6} 50 ${top}" stroke="${G2}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
      g+=`<path d="M50 ${top} q8 -8 0 -12 q-6 -2 -5 4" stroke="${G2}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
      [.2,.45,.7,.92].slice(0,stage+1).forEach((t,i)=>{const p=bz(t); g+=leaf(p[0],p[1],i%2?-25:-155,L,i%2?G1:G2);});
      if(stage>=3) [.33,.58,.82].forEach((t,i)=>{const p=bz(t),dx=i%2?-9:9;
        g+= stage===4 ? flower(p[0]+dx,p[1]-3,5,5,5,'#b79cff','#ffe08a',2.6) : `<circle cx="${p[0]+dx}" cy="${p[1]-2}" r="3.6" fill="#b79cff"/>`;});
    } else if(type==='twin'){
      const fy=110-h*.5;
      g+=`<path d="M50 110 L50 ${stage>=2?fy:top}" stroke="${G2}" stroke-width="4" stroke-linecap="round"/>`;
      g+=leaf(50,102,-30,L,G1)+leaf(50,104,-150,L,G2);
      if(stage>=2){
        g+=`<path d="M50 ${fy} Q40 ${fy-8} 35 ${top}" stroke="${G2}" stroke-width="3.5" fill="none" stroke-linecap="round"/>
            <path d="M50 ${fy} Q60 ${fy-8} 65 ${top}" stroke="${G2}" stroke-width="3.5" fill="none" stroke-linecap="round"/>`;
        if(stage===2) g+=leaf(35,top,-120,5,G1)+leaf(65,top,-60,5,G1);
        if(stage===3) g+=`<ellipse cx="35" cy="${top-5}" rx="5.5" ry="8" fill="#ff7fb0"/><ellipse cx="65" cy="${top-5}" rx="5.5" ry="8" fill="#ff7fb0"/>`;
        if(stage===4) g+=flower(35,top-4,5,9,9,'#ff7fb0','#ffe08a',5)+flower(65,top-4,5,9,9,'#ff9ec4','#ffe08a',5);
      }
    } else { // daisy
      g+=`<path d="M50 110 Q45 ${110-h/2} 50 ${top}" stroke="${G2}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
      g+=leaf(50,103,-30,L,G1)+leaf(50,105,-150,L,G2);
      if(stage>=2) g+=leaf(48,110-h*.55,-35,L*.8,G2)+leaf(48,110-h*.5,-145,L*.8,G1);
      if(stage===3) g+=`<ellipse cx="50" cy="${top-6}" rx="7" ry="10" fill="#fff" stroke="#d9c7a0" stroke-width="1"/><path d="M43 ${top-2} Q50 ${top+6} 57 ${top-2} Q50 ${top-6} 43 ${top-2}Z" fill="${G1}"/>`;
      if(stage===4) g+=flower(50,top-6,10,11,14,'#ffffff" stroke="#d9c7a0" stroke-width="1','#ffc94d',8);
    }
  }
  return `<svg viewBox="0 0 100 120" class="plant" aria-hidden="true">${g}</svg>`;
}
function fairySVG(){
  return `<svg viewBox="0 0 40 40" aria-hidden="true">
    <circle cx="20" cy="20" r="15" fill="rgba(255,240,170,.28)"/>
    <ellipse cx="11" cy="16" rx="7" ry="11" fill="rgba(205,185,255,.85)" transform="rotate(-28 11 16)"/>
    <ellipse cx="29" cy="16" rx="7" ry="11" fill="rgba(205,185,255,.85)" transform="rotate(28 29 16)"/>
    <path d="M20 17 L13.5 32 Q20 35.5 26.5 32 Z" fill="#ff9ecb"/>
    <circle cx="20" cy="13" r="5" fill="#fff3c4"/>
    <path d="M27 24 L33 18" stroke="#fff3c4" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M33.5 13.5 l1.2 2.8 2.8 1.2 -2.8 1.2 -1.2 2.8 -1.2 -2.8 -2.8 -1.2 2.8 -1.2z" fill="#ffe08a"/></svg>`;
}
function coverSVG(type){
  if(type==='mushroom') return `<svg viewBox="0 0 100 92"><path d="M40 92 Q37 66 42 50 L58 50 Q63 66 60 92Z" fill="#fff3dc"/>
    <path d="M4 54 Q50 -40 96 54 Q50 66 4 54Z" fill="#ff6b6b"/></svg>`;
  return `<svg viewBox="0 0 100 92"><path d="M6 52 C6 14 60 2 94 12 C98 52 74 88 34 88 C18 88 6 74 6 52Z" fill="#4fc27c"/>
    <path d="M14 78 C40 60 66 36 92 14" stroke="#2f8f58" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`;
}
function pips(stage){let s='';for(let i=1;i<=MAX_STAGE;i++)s+=`<span class="pip${i<=stage?' on':''}"></span>`;return s;}
function bondSVG(a,b,w){
  return `<svg viewBox="0 0 200 150" class="bond" aria-hidden="true">
   <path d="M100 42 L52 108 M100 42 L148 108" stroke="#cdbfa5" stroke-width="6" stroke-linecap="round"/>
   <circle cx="100" cy="36" r="30" fill="#b79cff"/><circle cx="52" cy="112" r="30" fill="#ff7fb0"/><circle cx="148" cy="112" r="30" fill="#ffb938"/>
   <g font-size="30" font-weight="900" text-anchor="middle" fill="#fff" font-family="inherit">
   <text x="100" y="47">${w}</text><text x="52" y="123">${a}</text><text x="148" y="123">${b}</text></g></svg>`;
}

/* ================= sound & speech ================= */
let AC;
function chime(kind){
  if(!S.sound) return;
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    const now=AC.currentTime, notes= kind==='ok'?[523,659,784] : kind==='grow'?[392,523,659,784,1047] : [247];
    notes.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain(),t=now+i*.09;
      o.type=kind==='no'?'sine':'triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(kind==='no'?.06:.12,t+.02); g.gain.exponentialRampToValueAtTime(.001,t+.36);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+.4);});
  }catch(e){}
}
function speak(text){
  try{ if(!('speechSynthesis' in window)) return; speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.rate=.85; u.pitch=1.15; speechSynthesis.speak(u);}catch(e){}
}

/* ================= garden screen ================= */
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id)); window.scrollTo(0,0);}
function renderGarden(){
  $('fairyIcon').innerHTML=fairySVG(); $('fairyCount').textContent=S.fairies;
  const box=$('plots'); box.innerHTML='';
  S.plots.forEach((p,i)=>{
    const b=document.createElement('button'); b.className='plot';
    if(!p){ b.innerHTML='<span class="plus">+</span>'; b.setAttribute('aria-label','Empty spot. Plant a seed'); b.onclick=()=>openSeeds(i); }
    else{
      b.innerHTML=plantSVG(p.type,p.stage)+(p.stage>=MAX_STAGE?`<span class="fairy">${fairySVG()}</span>`:`<span class="pips">${pips(p.stage)}</span>`);
      b.setAttribute('aria-label',PLANTS[p.type].name); b.onclick=()=>startRound(i);
    }
    box.appendChild(b);
  });
  const planted=S.plots.filter(Boolean).length, all=planted===9&&S.plots.every(p=>p.stage>=MAX_STAGE);
  $('doneBanner').classList.toggle('hide',!all);
  $('gsub').textContent= planted===0 ? 'Tap a spot to plant your first seed' : all ? '' : 'Tap a plant to help it grow';
}
function openSeeds(i){
  const box=$('seeds'); box.innerHTML='';
  Object.keys(PLANTS).forEach(t=>{
    const b=document.createElement('button'); b.className='seed';
    b.innerHTML=plantSVG(t,4)+`<b>${PLANTS[t].name}</b><em>${PLANTS[t].skill}</em><i>${PLANTS[t].ex}</i>`;
    b.onclick=()=>{S.plots[i]={type:t,stage:0};save();$('seedModal').classList.remove('on');startRound(i);};
    box.appendChild(b);
  });
  $('seedModal').classList.add('on');
}

/* ================= play screen ================= */
let cur=null; const lastKey={};
function startRound(i){
  const p=S.plots[i]; let r,tries=0;
  do{ r=GEN[p.type](Math.min(p.stage,3),S.max); tries++; }while(lastKey[p.type]===r.a+'-'+r.b && tries<6);
  lastKey[p.type]=r.a+'-'+r.b;
  cur={plot:i,round:r,i:0,solved:[],hinted:false,done:false,wrong:[]};
  $('growModal').classList.remove('on');
  show('play'); renderStep();
}
function eqText(st){return st.tokens.map(t=>t===null?st.answer:t).join(' ');}
function renderStep(redraw){
  const p=S.plots[cur.plot], st=cur.round.steps[cur.i];
  $('mini').innerHTML=plantSVG(p.type,p.stage); $('pname').textContent=PLANTS[p.type].name; $('ppips').innerHTML=pips(p.stage);
  $('clues').innerHTML=cur.solved.map(e=>`<span class="clue">${e}</span>`).join('');
  $('whole').innerHTML= st.whole!==null ? `<b>${st.whole}</b> altogether` : '';
  // picture
  const second= cur.done ? 'full' : (st.second.state==='cover'&&cur.hinted ? 'ghost' : st.second.state);
  const cells=[]; for(let k=0;k<st.first.n;k++) cells.push([st.first.kind,st.first.state,false]);
  if(second!=='cover') for(let k=0;k<st.second.n;k++) cells.push([st.second.kind,second,cur.done&&st.second.state!=='full']);
  let html=''; const nf=Math.max(1,Math.ceil(cells.length/10));
  for(let f=0;f<nf;f++){ html+='<div class="frame">';
    for(let k=0;k<10;k++){const c=cells[f*10+k]; html+=`<div class="cellx">${c?`<div class="dot ${c[0]} ${c[1]}${c[2]?' new':''}"></div>`:''}</div>`;}
    html+='</div>'; }
  if(second==='cover') html+=`<div class="cover${p.type==='mushroom'?' m':''}">${coverSVG(p.type)}<span>?</span></div>`;
  $('pic').innerHTML=html; $('pic').classList.toggle('still',!!redraw);
  // equation
  $('eq').innerHTML=st.tokens.map(t=> t===null ? `<span class="blank${cur.done?' done':''}">${cur.done?st.answer:'?'}</span>`
      : typeof t==='number' ? `<span>${t}</span>` : `<span class="op">${t}</span>`).join('');
  $('ask').textContent=st.ask;
  // number track: 0-10 on the top row, 11-20 lined up underneath
  const tr=$('track'); tr.innerHTML='';
  for(let n=0;n<=S.max;n++){
    const b=document.createElement('button'); b.className='num'; b.textContent=n;
    if(n===11) b.style.gridColumnStart=2;
    if(cur.wrong.includes(n)){b.classList.add('nope');b.disabled=true;}
    if(cur.done){b.disabled=true; if(n===st.answer) b.classList.add('yes');}
    b.onclick=()=>pick(n); tr.appendChild(b);
  }
  $('next').classList.toggle('hide',!cur.done);
  $('hint').classList.toggle('hide',cur.done||cur.hinted||st.second.state!=='cover');
}
function pick(n){
  if(cur.done) return; const st=cur.round.steps[cur.i];
  if(n===st.answer){ cur.done=true; cur.solved.push(eqText(st)); chime('ok'); renderStep(true); }
  else{ cur.wrong.push(n); if(st.second.state==='cover') cur.hinted=true; chime('no'); renderStep(true); }
}
function nextStep(){
  if(cur.i<cur.round.steps.length-1){ cur.i++; cur.done=false; cur.hinted=false; cur.wrong=[]; renderStep(); }
  else finishRound();
}
function finishRound(){
  const p=S.plots[cur.plot], was=p.stage, r=cur.round;
  if(p.stage<MAX_STAGE){ p.stage++; if(p.stage===MAX_STAGE) S.fairies++; }
  save(); chime('grow');
  const bloomedNow=was<MAX_STAGE&&p.stage===MAX_STAGE;
  $('growTitle').textContent= bloomedNow ? 'It bloomed!' : was===MAX_STAGE ? 'Lovely!' : 'It grew!';
  $('bond').innerHTML=bondSVG(r.a,r.b,r.w);
  $('fam').innerHTML=cur.solved.join('<br>');
  $('newplant').innerHTML=plantSVG(p.type,p.stage);
  $('growMsg').textContent= bloomedNow ? 'A fairy has moved in!' : was===MAX_STAGE ? 'Your fairy is dancing.' : `${r.a}, ${r.b} and ${r.w} are a number family.`;
  $('more').classList.toggle('hide',bloomedNow);
  $('growModal').classList.add('on');
}
function allBloomed(){ return S.plots.every(p=>p&&p.stage>=MAX_STAGE); }
function showParty(){
  S.partied=S.garden; save();
  $('partyPlots').innerHTML=S.plots.map(p=>`<div class="plot">${plantSVG(p.type,MAX_STAGE)}</div>`).join('');
  let r=''; for(let i=0;i<9;i++) r+=`<span class="pf" style="--a:${i*40}deg;--d:${-(i%3)*.37}s"><span><span>${fairySVG()}</span></span></span>`;
  $('ring').innerHTML=r; show('party'); chime('grow');
}
function newGarden(){ S.plots=Array(9).fill(null); S.garden++; save(); renderGarden(); show('garden'); }
function goGarden(){ $('growModal').classList.remove('on'); renderGarden();
  if(allBloomed() && S.partied!==S.garden) showParty(); else show('garden'); }

/* ================= wiring ================= */
$('next').onclick=nextStep;
$('hint').onclick=()=>{cur.hinted=true;renderStep(true);};
$('say').onclick=()=>speak(cur.round.steps[cur.i].say);
$('home').onclick=goGarden; $('toGarden').onclick=goGarden;
$('more').onclick=()=>startRound(cur.plot);
$('seedCancel').onclick=()=>$('seedModal').classList.remove('on');
$('newGarden').onclick=newGarden; $('partyNew').onclick=newGarden;
$('again').onclick=showParty; $('partyBack').onclick=()=>{renderGarden();show('garden');};
function renderSettings(){
  document.querySelectorAll('#segMax button').forEach(b=>b.classList.toggle('on',+b.dataset.v===S.max));
  document.querySelectorAll('#segSnd button').forEach(b=>b.classList.toggle('on',(b.dataset.v==='1')===S.sound));
  $('reset').textContent='Reset'; $('reset').dataset.arm='';
}
$('gear').onclick=()=>{renderSettings();$('setModal').classList.add('on');};
$('setClose').onclick=()=>$('setModal').classList.remove('on');
document.querySelectorAll('#segMax button').forEach(b=>b.onclick=()=>{S.max=+b.dataset.v;save();renderSettings();});
document.querySelectorAll('#segSnd button').forEach(b=>b.onclick=()=>{S.sound=b.dataset.v==='1';save();renderSettings();});
$('reset').onclick=e=>{const b=e.currentTarget;
  if(b.dataset.arm){S=Object.assign(fresh(),{max:S.max,sound:S.sound});save();renderGarden();renderSettings();}
  else{b.dataset.arm='1';b.textContent='Tap again to reset';}};

for(let i=0;i<14;i++){const f=document.createElement('i');f.className='fly';
  f.style.left=R(2,96)+'vw';f.style.top=R(4,92)+'vh';f.style.animationDelay=(-R(0,90)/10)+'s,'+(-R(0,30)/10)+'s';document.body.appendChild(f);}
renderGarden();
</script>
</body>
